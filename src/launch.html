<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kawaikara</title>
    <style>
      body {
        font: 16px system-ui;
        background: #151722;
        color: #eee;
        max-width: 560px;
        margin: 12vh auto;
        padding: 24px;
      }
      main {
        border: 1px solid #424555;
        border-radius: 12px;
        padding: 24px;
      }
      a,
      button {
        display: inline-block;
        padding: 10px 16px;
        border: 1px solid #656b83;
        border-radius: 6px;
        color: inherit;
        background: #282d40;
        font: inherit;
        margin: 8px 8px 0 0;
      }
      p {
        line-height: 1.6;
      }
      a[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kawaikara</h1>
      <p id="status" role="status"></p>
      <a id="launch" hidden></a><button id="cancel" type="button"></button>
    </main>
    <script src="launch.js"></script>
  </body>
</html>
